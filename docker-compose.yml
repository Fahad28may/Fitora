# Local development infrastructure for Fitora.
#
# Currently: MinIO (S3-compatible object storage for progress photos) plus a
# one-shot job that creates the private bucket automatically.
#
# Usage:
#   docker compose up -d          # start MinIO + auto-create the bucket
#   docker compose logs -f minio-provision   # see the bucket get created
#   docker compose down           # stop (keeps data in the named volume)
#   docker compose down -v        # stop AND wipe stored photos
#
# After `up`, put these in C:\Fitora\.env (they match the dev defaults below):
#   S3_ENDPOINT_URL=http://localhost:9000
#   S3_BUCKET=fitora-progress-photos
#   S3_ACCESS_KEY_ID=fitora
#   S3_SECRET_ACCESS_KEY=fitora-dev-password
#
# Console (browse the bucket): http://localhost:9001  (login: fitora / fitora-dev-password)
#
# These credentials are DEV-ONLY. For production, run MinIO behind TLS and
# create a dedicated, bucket-scoped access key instead of using the root user
# — see docs/third-party-services.md.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # Host ports are overridable to avoid clashing with another local MinIO:
      #   MINIO_API_PORT=9100 MINIO_CONSOLE_PORT=9101 docker compose up -d
      # (then set S3_ENDPOINT_URL to the matching host port). The container-side
      # ports never change, so provisioning and the console work regardless.
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API — the backend talks to this
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console — for you
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fitora-dev-password}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Waits for MinIO, then creates the private bucket. Runs once and exits.
  minio-provision:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      # mc auto-configures an alias named "local" from this variable.
      MC_HOST_local: http://${MINIO_ROOT_USER:-fitora}:${MINIO_ROOT_PASSWORD:-fitora-dev-password}@minio:9000
      BUCKET: ${S3_BUCKET:-fitora-progress-photos}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until mc ls local >/dev/null 2>&1; do echo "waiting for minio..."; sleep 1; done; mc mb --ignore-existing "local/$$BUCKET" && ( mc anonymous set none "local/$$BUCKET" || true ) && echo "MinIO ready — private bucket: $$BUCKET"'

volumes:
  minio-data:
